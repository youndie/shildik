name: Image

# Manual, and by tag. A provider image is a thing people deploy, and one appearing because a
# README changed is how a registry fills with versions nobody chose.
on:
  workflow_dispatch:
    inputs:
      latest:
        description: also push :latest
        type: boolean
        default: true

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain is a few hundred megabytes and does not change between runs.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The version is the one the artifacts carry, so an image and the libraries inside it can be
      # traced to the same run. `0.2.0.<run number>` of the publish workflow is not available here,
      # so the image takes its own run number and says so in a label.
      - name: Version
        id: version
        run: echo "value=0.2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Gradle builds the binary and assembles the context; docker only builds. Compiling inside
      # the Dockerfile would throw away the Gradle cache on every run.
      - name: Assemble the image context
        run: ./gradlew :distribution:imageContext --console=plain

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only, and deliberately: the binary in the context was linked for linuxX64.
      # A multi-arch manifest would need a second Kotlin/Native target and a second link — worth
      # doing when somebody asks for arm64, not before.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: distribution/build/image
          platforms: linux/amd64
          push: true
          build-args: BINARY=shildik.kexe
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ${{ inputs.latest && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenID Connect provider — reference distribution
            org.opencontainers.image.licenses=MIT

      # The image is the thing people deploy, so the run says what it produced rather than leaving
      # it to be found in the registry.
      - name: Summary
        run: |
          {
            echo "### ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
