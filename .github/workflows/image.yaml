name: Image

# Manual, and by tag. A provider image is a thing people deploy, and one appearing because a
# README changed is how a registry fills with versions nobody chose.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version tag, e.g. 0.2.0.8 — leave empty to push only the commit tag'
        type: string
        required: false
      latest:
        description: also push :latest
        type: boolean
        default: true

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain is a few hundred megabytes and does not change between runs.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # **The commit tag is the one that is always right.** A run number of this workflow would
      # look like a version and mean nothing: the libraries inside carry `0.2.0.<publish run>`, and
      # the two counters have no reason to agree. An image built from a commit is named after that
      # commit; a human-readable version is passed in when somebody decides there is one.
      # Inputs travel through the environment rather than into the script text: a value
      # interpolated into a shell line is a value that can end the line and start its own.
      # The `if` blocks are not style either — `[ … ] && …` as the last command of a step exits
      # non-zero when the condition is false, and the step fails for saying "no".
      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          tags="$REPO:sha-$(git rev-parse --short HEAD)"
          if [ -n "$VERSION" ]; then tags="$tags,$REPO:$VERSION"; fi
          if [ "$LATEST" = "true" ]; then tags="$tags,$REPO:latest"; fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"

      # Gradle builds the binary and assembles the context; docker only builds. Compiling inside
      # the Dockerfile would throw away the Gradle cache on every run.
      - name: Assemble the image context
        run: ./gradlew :distribution:imageContext --console=plain

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only, and deliberately: the binary in the context was linked for linuxX64.
      # A multi-arch manifest would need a second Kotlin/Native target and a second link — worth
      # doing when somebody asks for arm64, not before.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: distribution/build/image
          platforms: linux/amd64
          push: true
          build-args: BINARY=shildik.kexe
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenID Connect provider — reference distribution
            org.opencontainers.image.licenses=MIT

      # The image is the thing people deploy, so the run says what it produced rather than leaving
      # it to be found in the registry.
      - name: Summary
        run: |
          {
            echo "### pushed"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.value }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
