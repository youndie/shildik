name: Image

# On a release tag, and on demand. A provider image is a thing people deploy, and one appearing
# because a README changed is how a registry fills with versions nobody chose — so this is still not
# built on every push to `main`.
#
# A tag is the missing half of that rule rather than an exception to it. It is the moment somebody
# decided there is a version: the same judgement the manual button exists to require, made once and
# written into git instead of into a browser form. Without it the registry could lag `main`
# indefinitely with nothing able to say so — a fix sat unpublished for four days that way (#22), and
# neither the code nor CI could have reported it, because both were green and both were right.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version tag, e.g. 0.2.0.8 — leave empty to push only the commit tag'
        type: string
        required: false
      latest:
        description: also push :latest
        type: boolean
        default: true

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Java, Gradle and the ~/.konan cache in one step. That cache is not an optimisation to
      # taste: the Kotlin/Native toolchain is around a gigabyte and is a fresh download on every
      # cold runner without it.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"


      # **The commit tag is the one that is always right.** A run number of this workflow would
      # look like a version and mean nothing: the libraries inside carry `0.2.0.<publish run>`, and
      # the two counters have no reason to agree. An image built from a commit is named after that
      # commit; a human-readable version is passed in when somebody decides there is one.
      # Inputs travel through the environment rather than into the script text: a value
      # interpolated into a shell line is a value that can end the line and start its own.
      # The `if` blocks are not style either — `[ … ] && …` as the last command of a step exits
      # non-zero when the condition is false, and the step fails for saying "no".
      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          # Empty on a manual run. `inputs` are empty on a tag push, so the two never both speak.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          # A tag names its own version: `v0.2.0.13` becomes `0.2.0.13`. Reading `inputs` on this
          # event would silently produce an image with only a commit tag — a release nobody can
          # ask for by name.
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            # A release moves `latest`, because that is what the word means to whoever pulls it.
            # The one way this is wrong is a tag placed on an old commit, and the remedy is the
            # button that is still here: dispatch from the commit that should be latest.
            LATEST=true
          fi
          tags="$REPO:sha-$(git rev-parse --short HEAD)"
          if [ -n "$VERSION" ]; then tags="$tags,$REPO:$VERSION"; fi
          if [ "$LATEST" = "true" ]; then tags="$tags,$REPO:latest"; fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"

      # Gradle builds the binary and assembles the context; docker only builds. Compiling inside
      # the Dockerfile would throw away the Gradle cache on every run.
      - name: Assemble the image context
        run: ./gradlew :distribution:imageContext --console=plain

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only, and deliberately: the binary in the context was linked for linuxX64.
      # A multi-arch manifest would need a second Kotlin/Native target and a second link — worth
      # doing when somebody asks for arm64, not before.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: distribution/build/image
          platforms: linux/amd64
          push: true
          build-args: BINARY=shildik.kexe
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenID Connect provider — reference distribution
            org.opencontainers.image.licenses=MIT

      # The image is the thing people deploy, so the run says what it produced rather than leaving
      # it to be found in the registry.
      - name: Summary
        run: |
          {
            echo "### pushed"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.value }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
