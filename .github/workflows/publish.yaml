name: Publish

# Manual only. These artifacts are consumed by other projects, and a version appearing in the
# registry because someone pushed a README fix is how a registry fills up with noise.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java, Gradle and the ~/.konan cache in one step. That cache is not an optimisation to
      # taste: the Kotlin/Native toolchain is around a gigabyte and is a fresh download on every
      # cold runner without it.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"


      # The version is `<head>.<run number>`: monotonic, traceable back to a run, and impossible to
      # produce twice by accident. See `gradle.properties` for what each step of the line marks.
      #
      # THE HEAD IS READ FROM `gradle.properties`, not spelled again here. It used to be written in
      # both files with a comment in each saying the two move together, and that is precisely what
      # did not happen: the 0.4.1 release bumped `gradle.properties` and left this line at 0.4.0, so
      # the next publish put `0.4.1` sources into the registry under `0.4.0.20`. Nothing failed —
      # a version off the previous head looks exactly like a version.
      - name: Publish to snapshots
        # The repository is named `wip` by the shared convention; it was `reposilite` here. Same
        # server, same credentials — and they arrive as ORG_GRADLE_PROJECT_ properties now, because
        # that is how the convention reads them.
        run: |
          head=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$head" ]; then
            echo "gradle.properties has no version= line; there is no head to publish under" >&2
            exit 1
          fi
          ./gradlew publishAllPublicationsToWipRepository -PVERSION="$head.${{ github.run_number }}"
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
