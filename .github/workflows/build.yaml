name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain is a few hundred megabytes and does not change between runs.
      # Without this cache every build downloads it again, which costs more than the build itself.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Linux targets rather than the macOS one: the runner is Linux, and cross-compiling to Apple
      # targets is not possible here. What this proves is that the common code works away from the
      # JVM — which is the whole point of these modules.
      - run: ./gradlew check -x macosArm64Test
