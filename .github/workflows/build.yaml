name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java, Gradle and the ~/.konan cache in one step. That cache is not an optimisation to
      # taste: the Kotlin/Native toolchain is around a gigabyte and is a fresh download on every
      # cold runner without it.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"


      # Linux targets rather than the macOS one: the runner is Linux, and cross-compiling to Apple
      # targets is not possible here. What this proves is that the common code works away from the
      # JVM — which is the whole point of these modules.
      - run: ./gradlew check -x macosArm64Test

  # The chart is not built by Gradle, so nothing else would ever look at it. A template that stops
  # rendering is found by whoever installs it otherwise — which is the worst possible reviewer.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint charts/shildik --set issuer=https://id.example.com --set database.jdbcUrl=jdbc:postgresql://pg:5432/shildik --set ingress.host=id.example.com

      # Rendered with the trial database on, because that half is otherwise never exercised.
      - run: helm template idp charts/shildik --set issuer=https://id.example.com --set database.jdbcUrl=jdbc:postgresql://pg:5432/shildik --set ingress.host=id.example.com --set postgres.enabled=true > /dev/null

      - run: helm lint charts/shildik-sqlite --set issuer=https://id.example.com --set ingress.host=id.example.com

      # Both paths through the volume: the claim this chart creates, and one somebody else manages.
      - run: helm template idp charts/shildik-sqlite --set issuer=https://id.example.com --set ingress.host=id.example.com > /dev/null
      - run: helm template idp charts/shildik-sqlite --set issuer=https://id.example.com --set ingress.host=id.example.com --set storage.existingClaim=mine > /dev/null

      # The guards are part of the contract: a chart that installs without an issuer produces a
      # provider whose tokens no client accepts, and the failure surfaces hours later.
      - name: Required values are required
        run: |
          if helm template idp charts/shildik > /dev/null 2>&1; then
            echo "chart rendered without issuer or jdbcUrl — the guards are gone" >&2
            exit 1
          fi
          if helm template idp charts/shildik-sqlite > /dev/null 2>&1; then
            echo "the sqlite chart rendered without an issuer — the guard is gone" >&2
            exit 1
          fi

      # A single replica is the whole safety argument of the SQLite chart: one writer, one file.
      # A values file cannot raise it, and neither can a careless edit to the template.
      - name: One replica, and a rollout that stops before it starts
        run: |
          rendered=$(helm template idp charts/shildik-sqlite --set issuer=https://id.example.com --set ingress.host=id.example.com)
          echo "$rendered" | grep -q 'replicas: 1' || { echo "the sqlite deployment no longer says replicas: 1" >&2; exit 1; }
          echo "$rendered" | grep -q 'type: Recreate' || { echo "the sqlite deployment lost its Recreate strategy" >&2; exit 1; }
