org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
org.gradle.configuration-cache=true

# 0.3.x, and each step of that line marks a move rather than a feature. 0.2.x was the move out of a
# private repository, where the same coordinates had been published up to 0.1.0.5: the run numbers
# here start from one, so continuing the old line would have handed consumers a LOWER version of the
# same artifact from a different repository. 0.3.x is the move of the group itself, from
# `ru.workinprogress.shildik` to `io.github.youndie.shildik` — no consumer reaches the new
# coordinate without editing it, so the number should not suggest a patch will do.
#
# CI appends the run number through -PVERSION; a local build stays at 0.3.0, because there is
# nowhere to get a run number locally and inventing one means overwriting somebody else's artifact
# in the registry one day. The head is also spelled in `publish.yaml`; the two move together.
version=0.3.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.shildik
sborka.repository=youndie/shildik
sborka.description=An OpenID Connect provider in Kotlin: multiplatform, JVM and Kotlin/Native, with sign-in methods as modules.
sborka.inceptionYear=2026

# 25 for both — the same version the services that consume these libraries run on. The floor has to
# be said out loud either way, or a consumer below it resolves the library, compiles against it and
# meets UnsupportedClassVersionError at class loading, with a message naming a bytecode version
# rather than this library.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# REQUIRED BY THE `wasmJs` TARGET IN `shared-oidc`, and not obviously so.
#
# A module with a `js` or `wasmJs` target does not declare a repository — the KOTLIN PLUGIN does, on
# the project: an ivy repository for the Node distribution, and another for binaryen. The default
# FAIL_ON_PROJECT_REPOS refuses the build over a repository nobody here wrote ("repository
# 'Distributions at https://nodejs.org/dist' was added by unknown code"), and PREFER_SETTINGS
# ignores them, which arrives as `Could not find org.nodejs:node:25.0.0` — a missing artefact rather
# than an overridden repository. Both were reproduced here before this line was written.
#
# Neither surfaces on compilation. `:shared-oidc:compileKotlinWasmJs` is green under the default
# mode; it is `wasmJsBrowserTest` that needs Node, so a build that only compiles the new target
# says nothing about this.
#
# Declaring those ivy repositories in settings instead means copying a layout that belongs to the
# Kotlin plugin and changes with it. What PREFER_PROJECT gives up is a guard against a module
# declaring its own repositories — and no module here declares any. Same trade, same reasons, as in
# kvadrant-ui.
sborka.repositoriesMode=PREFER_PROJECT

# Targets a host cannot build are skipped rather than failing the build: the CLI declares macOS and
# Linux at once, and CI runs on Linux only.
kotlin.native.ignoreDisabledTargets=true
# Klibs for another platform are cross-compiled from this machine — that is what lets one host
# produce the Linux binary without docker.
kotlin.native.enableKlibsCrossCompilation=true

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for a published library and sborka turns
# it on by default; here it is roughly 150 declarations across `crypto`, `shared`, `oidc-auth-core`
# and `ktor-role-based-auth`, and the build stopped before reaching the other eleven modules.
# Spelling out a visibility and a return type on every public declaration is a change to the LIBRARY,
# not to how it is built — folded into the migration it would bury whatever the migration itself
# breaks in a diff nobody can read.
# Tracked separately: youndie/shildik#18.
sborka.explicitApi=false
